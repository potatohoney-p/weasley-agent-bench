name: Offline contracts and experiments

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Test contracts, CLI, fault matrix and memory cutoffs
        run: python -m unittest discover -s tests -v
      - name: Export reusable memory suite
        run: python -m experiments.memory_horizon --output-dir reports/memory-ci
      - name: Evaluate exported reference run
        run: python -m weasley_agent_bench evaluate reports/memory-ci/suite.json reports/memory-ci/latest-record.json
